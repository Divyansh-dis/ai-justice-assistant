version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: justice-assistant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - LEGAL_DATA_DIR=/app/legal_data
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - DATABASE_URL=sqlite:////app/app_data.db
    volumes:
      - ./legal_data:/app/legal_data
      - ./chroma_db:/app/chroma_db
      - ./backend/app_data.db:/app/app_data.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: justice-assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
